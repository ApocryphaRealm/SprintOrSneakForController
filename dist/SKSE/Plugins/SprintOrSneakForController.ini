; Sprint or Sneak for Controller - settings. There is no in-game page: edit this file with the game closed.
; Read when a game loads or starts. Lines starting with ';' are notes.

[Settings]

; How long, in seconds, you hold the Sprint button before it counts as a hold (crouch when still, sprint when moving).
; A shorter press is a tap, and this mod leaves taps alone, so a dodge mod's Sprint tap still works.
; 0 = automatic: 0.30 seconds, or the dodge mod's tap time (its fSprintingPressDuration) when TK Dodge AIO's or
; Simple Dodge's Sprint-tap dodge is on and that is longer (the longer of the two when both are on).
; With a Sprint-tap dodge on, this mod decides whether a press is a tap or a hold and tells the dodge mod, so one press
; is never both a dodge and a sprint or crouch: a tap is the dodge's, a hold is this mod's.
; Any other value (0.05 to 2.00) is used as it is. Shorter than the dodge mod's tap time, the presses between the two
; count as holds here, so only the shorter presses dodge.
fHoldSeconds = 0

; How long, in seconds, the game may go without reporting the held button before this mod treats it as let go
; (for example when a menu opened and took the release). 0.05 to 2.00. Leave it unless a hold ends on its own.
fReleaseGapSeconds = 0.25

; Take a Peek (only while its plugin is loaded): when you are crouched, standing still, and looking at a closed door
; close enough to open, holding Sprint does not stand you up - the hold is left to Take a Peek, so you peek.
; Everywhere else the hold works as usual. 1 = on, 0 = off (a crouched, still hold always stands you up).
bTakeAPeekDoors = 1

[Debug]
; The log, SKSE\SprintOrSneakForController.log: 0 trace, 1 debug (every press), 2 info (each hold's decision - the default),
; 3 warn, 4 error, 5 critical, 6 off.
uLogLevel = 2
